<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Registration - Glow & Gather</title>

    <link rel="stylesheet" href="projekuts.css">
    <link rel="icon" type="image/jpeg" href="images/Glow & Gather.jpg">
</head>
<body>
    
    <header>
        <div class="logo">Glow & Gather</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="gallery.html">Gallery</a>
            <a href="articles.html">Articles</a>
            <a href="registration.html">Registration</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="registration-banner">
        <h1>Pendaftaran</h1>
        <p>Gabung Glow & Gather dan temukan aroma favorit Anda.</p>
    </section>

    <section class="registration-section">
        <div class="registration-container">
            <h2>Buat Akun Anda</h2>
            <p>Silakan isi formulir berikut untuk melakukan pendaftaran.</p>

            <form action="#" method="post">

                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama"
                       placeholder="Masukkan nama lengkap" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="Masukkan email" required>

                <label for="telepon">Nomor Telepon</label>
                <input type="tel" id="telepon" name="telepon"
                       placeholder="Masukkan nomor telepon" required>

                <label for="alamat">Alamat</label>
                <textarea id="alamat" name="alamat"
                          placeholder="Masukkan alamat lengkap"
                          rows="4" required></textarea>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Buat password" required>

                <button type="submit">Daftar Sekarang</button>

            </form>
        </div>
    </section>

    <footer>
        <p>© 2026 Glow & Gather. All Rights Reserved.</p>
    </footer>

</body>
</html>
